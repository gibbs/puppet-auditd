---
name: Testing

on:
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  setup_matrix:
    name: Setup Test Matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      puppet_unit_test_matrix: ${{ steps.get-outputs.outputs.puppet_unit_test_matrix }}
      github_action_test_matrix: ${{ steps.get-outputs.outputs.github_action_test_matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Run static validations
        run: bundle exec rake validate lint

      - name: Run rake rubocop
        run: bundle exec rake rubocop

      - name: Setup Test Matrix
        id: get-outputs
        run: bundle exec metadata2gha --pidfile-workaround false

  unit:
    needs: setup_matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{fromJson(needs.setup_matrix.outputs.puppet_unit_test_matrix)}}
    name: Spec Puppet ${{ matrix.puppet }} (Ruby ${{ matrix.ruby }})
    steps:
      - uses: actions/checkout@v4

      - name: Setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake parallel_spec

  acceptance:
    name: Acceptance Test
    needs: unit
    runs-on: ubuntu-24.04
    env:
      BOLT_GEM: true
      CI: true
    steps:
      - uses: actions/checkout@v4
      - name: Setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Provision Testing Environments
        run: bundle exec rake 'litmus:provision_list[default]'

      - name: Debug SSH auth on provisioned containers
        run: |
          sudo apt-get update -y >/dev/null && sudo apt-get install -y sshpass >/dev/null

          for cid in $(docker ps -q); do
            image=$(docker inspect --format '{{.Config.Image}}' "$cid")
            echo "::group::${cid} (${image})"
            echo "--- sshd -T (effective config, after all Includes) ---"
            docker exec "$cid" sshd -T 2>&1 | grep -Ei '^(permitrootlogin|passwordauthentication|usepam|challengeresponseauthentication) ' || true
            echo "--- root shadow entry ---"
            docker exec "$cid" grep '^root:' /etc/shadow || true
            echo "--- sshd service status ---"
            docker exec "$cid" systemctl status sshd --no-pager 2>&1 || docker exec "$cid" service ssh status 2>&1 || true
            echo "::endgroup::"
          done

          ruby -ryaml -e '
            data = YAML.load_file("spec/fixtures/litmus_inventory.yaml")
            data["groups"][0]["targets"].each do |t|
              port = t["config"]["ssh"]["port"]
              platform = t["facts"]["platform"]
              cid = t["facts"]["container_id"]
              puts "::group::ssh -vvv port #{port} (#{platform})"
              system("sshpass -p root ssh -vvv -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -p #{port} root@localhost true")
              puts "::endgroup::"
              puts "::group::journal (pam/sshd) for #{cid} (#{platform})"
              # OpenSSH >= 9.8 (e.g. EL9) splits per-connection handling into a separate
              # sshd-session process, so both comms need to be matched (OR'd via "+").
              system("docker exec #{cid} journalctl --no-pager -q -n 100 _COMM=sshd + _COMM=sshd-session 2>&1")
              puts "::endgroup::"
            end
          '

      - name: Install Puppet Agent
        run: bundle exec rake 'litmus:install_agent'

      - name: Install Modules
        run: |
          bundle exec rake 'litmus:install_modules_from_directory'
          bundle exec rake 'litmus:install_module'

      - name: Run Tests
        run: bundle exec rake 'litmus:acceptance:parallel'

      - name: Tear Down
        run: bundle exec rake 'litmus:tear_down'

  tests:
    needs:
      - unit
      - acceptance
    runs-on: ubuntu-24.04
    name: Test suite
    steps:
      - run: echo Test suite completed
